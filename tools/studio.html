<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:BC;font-weight:600;src:url(barlow-condensed-latin-600-normal.woff2)}
@font-face{font-family:BC;font-weight:700;src:url(barlow-condensed-latin-700-normal.woff2)}
@font-face{font-family:BC;font-weight:700;font-style:italic;src:url(barlow-condensed-latin-700-italic.woff2)}
html,body{margin:0;background:transparent}
#stage{display:inline-block;line-height:0}
</style></head>
<body><div id="stage"></div>
<script>
// ---------- geometry (466 design, 0deg = 12 o'clock, clockwise) ----------
const C=233, A0=-135, SWEEP=270;
const F="font-family='BC'";
const pt=(cx,cy,r,deg)=>{const a=deg*Math.PI/180;return [cx+r*Math.sin(a),cy-r*Math.cos(a)];};
const arc=(cx,cy,r,a0,a1)=>{const [x0,y0]=pt(cx,cy,r,a0),[x1,y1]=pt(cx,cy,r,a1);return `M${x0.toFixed(2)} ${y0.toFixed(2)} A${r} ${r} 0 ${a1-a0>180?1:0} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}`;};
const ang=v=>A0+SWEEP*v/60;
const GAUGES={fuel:[128,238],temp:[338,238]}, GR=34, GA0=-110, GA1=110;
const COL={needle:'#ff5a1f',red:'#e5202e',redTxt:'#ff3b47',amber:'#ffb020',green:'#3ddc84',muted:'#8b9099',track:'#3a3d42',white:'#ffffff'};
const svg=(w,h,body,defs='')=>`<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><defs>${defs}</defs>${body}</svg>`;
const glow=`<filter id="glow" x="-80%" y="-20%" width="260%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>`;
const ledGlow=`<filter id="lg" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>`;
const text=(x,y,s,{size=14,weight=600,fill=COL.muted,anchor='middle',ls=0,italic=false}={})=>
  `<text x="${x}" y="${y}" text-anchor="${anchor}" ${F} font-weight="${weight}" font-size="${size}" ${italic?"font-style='italic'":''} fill="${fill}" letter-spacing="${ls}">${s}</text>`;

// ---------- dial ----------
function dial(aod){
  let b='';
  const dim=aod?0.45:1;
  if(!aod) b+=`<rect width="466" height="466" fill="#000"/><circle cx="${C}" cy="${C}" r="233" fill="url(#dg)"/>`;
  else b+=`<rect width="466" height="466" fill="#000"/>`;
  b+=`<path d="${arc(C,C,221,ang(50),ang(60))}" stroke="${COL.red}" stroke-width="${aod?3:10}" fill="none" opacity="${dim}"/>`;
  if(!aod) b+=`<path d="${arc(C,C,227,A0,A0+SWEEP)}" stroke="${COL.track}" stroke-width="1.5" fill="none"/>`;
  for(let i=0;i<=60;i++){
    const a=ang(i), major=i%10===0, mid=i%5===0;
    if(aod && !major) continue;
    const len=major?22:mid?13:7, w=major?4:mid?2.5:1.5;
    const [x0,y0]=pt(C,C,214,a),[x1,y1]=pt(C,C,214-len,a);
    b+=`<line x1="${x0}" y1="${y0}" x2="${x1}" y2="${y1}" stroke="${i>=50?COL.redTxt:'#e9eaec'}" stroke-width="${w}" opacity="${(major?1:0.8)*dim}"/>`;
  }
  for(let n=0;n<=6;n++){
    const [x,y]=pt(C,C,172,ang(n*10));
    b+=text(x,y+12,n,{size:36,weight:700,italic:true,fill:n>=5?COL.redTxt:'#fff'}).replace('<text','<text opacity="'+dim+'"');
  }
  b+=text(C,118,'× 10 MIN · RPH',{size:15,ls:2}).replace('<text','<text opacity="'+dim+'"');
  // gear box
  b+=`<rect x="${C-46}" y="276" width="92" height="76" rx="10" fill="${aod?'none':'#111316'}" stroke="${aod?'#555':COL.needle}" stroke-width="2"/>`;
  b+=text(C,292,'GEAR',{size:12,ls:2});
  if(!aod){
    // mini gauges
    const g=(cx,cy,l0,l1,title,zones)=>{
      let s=`<path d="${arc(cx,cy,GR,GA0,GA1)}" stroke="${COL.track}" stroke-width="5" fill="none"/>`;
      zones.forEach(([f0,f1,c])=>s+=`<path d="${arc(cx,cy,GR,GA0+220*f0,GA0+220*f1)}" stroke="${c}" stroke-width="5" fill="none"/>`);
      const [lx0,ly0]=pt(cx,cy,GR+11,GA0-6),[lx1,ly1]=pt(cx,cy,GR+11,GA1+6);
      s+=text(lx0,ly0+5,l0)+text(lx1,ly1+5,l1);
      s+=text(cx,cy+22,title,{size:12,ls:1.5});
      return s;
    };
    b+=g(...GAUGES.fuel,'E','F','FUEL',[]);
    b+=g(...GAUGES.temp,'C','H','TEMP',[[0,.25,'#3d8bff'],[.8,1,COL.red]]);
    // shift light sockets
    for(let i=0;i<6;i++) b+=`<circle cx="${C-65+i*26}" cy="142" r="7.5" fill="#1c1e22" stroke="#2c2f34" stroke-width="1"/>`;
    // odometer boxes
    const x0=C-(6*22-2)/2, y0=364;
    for(let i=0;i<6;i++) b+=`<rect x="${x0+i*22}" y="${y0}" width="20" height="28" rx="3" fill="${i===5?'#e9eaec':'#1b1d21'}" stroke="#2e3137"/>`;
    b+=text(x0-8,y0+19,'ODO',{size:12,anchor:'end',ls:1.5});
    // heart icon for HR
    b+=heart(272,406,18,COL.amber);
  }
  const defs=`<radialGradient id="dg" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#15171a"/><stop offset="100%" stop-color="#000"/></radialGradient>`;
  return svg(466,466,b,defs);
}
function heart(x,y,s,c){ // top-left x,y, size s
  const k=s/24;
  return `<path transform="translate(${x} ${y}) scale(${k})" d="M12 21s-7.5-4.6-10-9.3C.4 8.5 2.2 4.5 6 4.5c2.2 0 3.6 1.2 4.5 2.6h3C14.4 5.7 15.8 4.5 18 4.5c3.8 0 5.6 4 4 7.2C19.5 16.4 12 21 12 21z" fill="${c}"/>`;
}

// ---------- needles ----------
function needle(aod){ // 28x248, pivot (14,210)
  const cx=14, py=210, tip=py-202, tail=py+30;
  const body=aod
    ? `<path d="M${cx-4} ${tail-4} L${cx-2} ${tip} L${cx+2} ${tip} L${cx+4} ${tail-4} Z" fill="none" stroke="${COL.needle}" stroke-width="1.5"/>`
    : `<path d="M${cx-6} ${tail} L${cx-2.5} ${tip} L${cx+2.5} ${tip} L${cx+6} ${tail} Z" fill="${COL.needle}" filter="url(#glow)"/>`;
  return svg(28,248,body,glow);
}
function hub(aod){ // 44x44, center 22
  return svg(44,44,`<circle cx="22" cy="22" r="${aod?12:20}" fill="${aod?'#000':'#1a1c20'}" stroke="#3a3d42" stroke-width="2"/><circle cx="22" cy="22" r="5" fill="${COL.needle}"/>`);
}
function miniNeedle(){ // 10x48 pivot (5,40)
  return svg(10,48,`<line x1="5" y1="46" x2="5" y2="2" stroke="${COL.needle}" stroke-width="2.5" stroke-linecap="round"/><circle cx="5" cy="40" r="3.5" fill="${COL.needle}"/>`);
}
function fuelFill(level){ // 96x96, gauge center (48,48); level 0..20
  const f=level/20;
  if(f<0.01) return svg(96,96,'');
  const col=f<0.2?COL.redTxt:COL.amber;
  return svg(96,96,`<path d="${arc(48,48,GR,GA0,GA0+220*f)}" stroke="${col}" stroke-width="5" fill="none"/>`);
}
function lights(n){ // 170x24, LED centers x=20+26i, y=12
  let b='';
  for(let i=0;i<n;i++){
    const col=i<3?COL.green:i<5?COL.amber:'#ff2d3a';
    b+=`<circle cx="${20+i*26}" cy="12" r="7.5" fill="${col}" filter="url(#lg)"/>`;
  }
  return svg(170,24,b,ledGlow);
}
// ---------- glyphs ----------
const glyph=(w,h,s,opts)=>svg(w,h,text(w/2,opts.base,s,{anchor:'middle',...opts}));
const R={
  'bg':()=>dial(false), 'bg_aod':()=>dial(true),
  'needle':()=>needle(false),'needle_aod':()=>needle(true),
  'hub':()=>hub(false),'hub_aod':()=>hub(true),
  'mini_needle':miniNeedle,
};
for(let l=0;l<=20;l++) R[`fuel/${l}`]=()=>fuelFill(l);
for(let n=0;n<=6;n++) R[`lights/${n}`]=()=>lights(n);
for(let d=0;d<10;d++){
  R[`gear/${d}`]=()=>glyph(30,50,d,{size:54,weight:700,fill:'#fff',base:44});
  R[`odo/${d}`]=()=>glyph(20,28,d,{size:22,weight:700,fill:'#e9eaec',base:22});
  R[`odo_last/${d}`]=()=>glyph(20,28,d,{size:22,weight:700,fill:'#000',base:22});
  R[`small/${d}`]=()=>glyph(11,22,d,{size:20,weight:700,fill:'#fff',base:18});
  R[`amber/${d}`]=()=>glyph(12,24,d,{size:22,weight:600,fill:COL.amber,base:20});
}
R['small/percent']=()=>glyph(12,22,'%',{size:18,weight:700,fill:'#fff',base:18});
R['small/deg']=()=>glyph(8,22,'°',{size:20,weight:700,fill:'#fff',base:18});
R['small/minus']=()=>glyph(8,22,'-',{size:20,weight:700,fill:'#fff',base:18});
R['small/none']=()=>glyph(22,22,'--',{size:20,weight:700,fill:'#fff',base:18});
R['amber/none']=()=>glyph(24,24,'--',{size:22,weight:600,fill:COL.amber,base:20});
['MON','TUE','WED','THU','FRI','SAT','SUN'].forEach((s,i)=>R[`date/w${i+1}`]=()=>glyph(46,24,s,{size:22,weight:600,fill:COL.amber,base:20,ls:2}));
['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'].forEach((s,i)=>R[`date/m${i+1}`]=()=>glyph(46,24,s,{size:22,weight:600,fill:COL.amber,base:20,ls:2}));

window.ASSETS=Object.keys(R);
window.renderAsset=name=>{document.getElementById('stage').innerHTML=R[name]();};
</script></body></html>
